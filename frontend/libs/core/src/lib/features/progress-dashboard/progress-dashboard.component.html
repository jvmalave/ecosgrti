<div class="card shadow-sm border-0 mb-3 progress-dashboard-card">
  <div class="card-body p-3">
    <!-- Cabecera: Título y Porcentaje Global -->
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h6 class="mb-0 text-muted fw-bold">Avance Global del Requerimiento</h6>
      <span class="fw-bold fs-5 transition-colors" [ngClass]="textClass()">
        {{ globalProgress() }}%
      </span>
    </div>

    <!-- Contenedor de la barra de progreso -->
    <div class="progress" style="height: 0.8rem">
      <div
        class="progress-bar progress-bar-striped progress-bar-animated transition-width"
        role="progressbar"
        [ngClass]="barColorClass()"
        [style.width.%]="globalProgress()"
        [attr.aria-valuenow]="globalProgress()"
        aria-valuemin="0"
        aria-valuemax="100"
      ></div>
    </div>

    <!-- Leyenda inferior: Estado global actual -->
    <div class="mt-2 text-end">
      <small class="text-muted fw-semibold">
        <span class="text-uppercase badge bg-light text-dark border">
      {{ currentStatusName }}
    </span>
      </small>
    </div>
  </div>
</div>

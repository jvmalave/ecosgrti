<div class="modal-overlay">
  <div class="modal-dialog-custom shadow-lg">
    <!-- HEADER CORPORATIVO -->
    <div
      class="modal-header d-flex justify-content-between align-items-center text-white"
    >
      <h5 class="mb-0 fw-bold">
        <i class="fa-solid fa-file-signature me-2"></i> 
        Aprobación Funcional
      </h5>
      <button
          type="button"
          class="close-btn"
          (click)="closeModal.emit()"
          [disabled]="isSubmitting()"
          aria-label="Cerrar modal"
        >
          <i class="fa-solid fa-circle-xmark"></i>
        </button>
    </div>
    <div class="modal-body p-4">
      <!-- INFO DEL REQUERIMIENTO Y ROL -->
      <div class="col-md-6 d-flex align-items-center ps-5">
        <span class="text-muted fw-bold me-2 fs-6">Requerimiento:</span>
        <span
          class="badge badge-requirement rounded-pill px-3 py-2 fs-6 fw-semibold"
        >
          {{ rrti() }}
        </span>
      </div>
      <div class="col-md-6 d-flex align-items-center justify-content-end pe-5">
        <span class="text-muted fw-bold me-2 fs-6">Rol:</span>
        <span
          class="badge badge-component rounded-pill px-3 py-2 fs-6 fw-semibold"
        >
          {{ roleName() }}
        </span>
      </div>
      <!-- ALERTA INFORMATIVA -->
      <div
        class="alert alert-info bg-light border-info mb-4"
        role="alert"
        style="line-height: 1.5"
      >
        <i class="fa-solid fa-circle-info me-2 text-info"></i>
        Al cargar este documento, <strong>{{ consultantName() }}</strong> de la
        unidad <strong>{{ functionalUnit() }}</strong> certifica formalmente que
        las pruebas para este rol han concluido satisfactoriamente.
      </div>
      <!-- FORMULARIO -->
      <form [formGroup]="approvalForm" (ngSubmit)="onSubmit()">
        <!-- INPUT TIPO ARCHIVO (PDF) -->
        <div class="mb-4">
          <label
            for="fileInput"
            class="form-label fw-bold text-secondary text-uppercase"
            style="font-size: 0.8rem; letter-spacing: 0.5px"
          >
            Acta de Aprobación (PDF) <span class="text-danger">*</span>
          </label>
          <input
            type="file"
            id="fileInput"
            class="form-control form-control-lg"
            accept="application/pdf"
            (change)="onFileSelected($event)"
            [disabled]="isSubmitting()"
            aria-label="Seleccionar archivo"
            #fileInput
          />
          <div class="form-text mt-1 text-muted">
            Tamaño máximo admitido: 5 MB.
          </div>
        </div>

        <!-- OBSERVACIONES (OPCIONAL) -->
        <!-- <div class="mb-4">
          <label for="observations" class="form-label fw-bold text-secondary text-uppercase" style="font-size: 0.8rem; letter-spacing: 0.5px;">
            Observaciones (Opcional)
          </label>
          <textarea 
            class="form-control" 
            id="observations"
            formControlName="observations" 
            rows="3" 
            placeholder="Ingrese comentarios adicionales sobre la aprobación..."
            [class.is-invalid]="approvalForm.get('observations')?.invalid && approvalForm.get('observations')?.touched"
          ></textarea>
          @if (approvalForm.get('observations')?.invalid) {
            <div class="invalid-feedback">Las observaciones no pueden exceder los 1000 caracteres.</div>
          }
        </div> -->

        <!-- BOTONES DE ACCIÓN -->
        <div class="d-flex justify-content-end gap-2 border-top pt-3 mt-4">
          <button
            type="button"
            class="btn btn-tbl-close px-4"
            (click)="closeModal.emit()"
            [disabled]="isSubmitting()"
          >
            Cancelar
          </button>

          <button
            type="submit"
            class="btn btn-tbl-success px-4 shadow-sm"
            [disabled]="isSubmitting()"
            style="background: #aa00ff; border: none"
          >
            @if (isSubmitting()) {
              <span
                class="spinner-border spinner-border-sm me-2"
                role="status"
                aria-hidden="true"
              ></span>
              Procesando...
            } @else {
              <i class="fa-solid fa-cloud-arrow-up me-2"></i> Registrar
              Aprobación
            }
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
